spring.application.name=Game

# FIXED: Spring Boot 4.x renamed the MongoDB property prefix
spring.mongodb.uri=${MONGODB_URI}

server.port=${PORT:8080}

# FIXED: Also renamed in Spring Boot 4.x
spring.mongodb.auto-index-creation=true

# Jackson (Jackson 3 - Spring Boot 3.5+)
spring.jackson.default-property-inclusion=non_null

# Seeding
app.seed.enabled=${SEED_ENABLED:true}
app.seed.force=${SEED_FORCE:false}

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.com.imposter.game=DEBUG

# CORS (update for production)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Room Cleanup
app.room.expiration-hours=${ROOM_EXPIRATION_HOURS:2}
app.room.cleanup-interval-minutes=${ROOM_CLEANUP_INTERVAL:30}

# Admin Configuration
app.admin.api-key=${ADMIN_API_KEY:admin-secret-key}
